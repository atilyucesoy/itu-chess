<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="İTÜ Satranç Kulübü turnuvaları, sonuçları ve oyuncu ratingleri." />
    <meta name="theme-color" content="#f1ebe0" />
    <title>İTÜ Satranç Kulübü</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="masthead">
        <a class="brand" href="#tournaments"><img src="/club-logo-gold.png" width="24" height="34" alt="" /> İTÜ Satranç Kulübü</a>
        <a href="https://itu-chess.onrender.com/#settings">Yönetici girişi</a>
      </header>
      <nav class="navigation" aria-label="Kulüp sayfaları">
        <a id="tournaments-link" href="#tournaments">Turnuvalar</a>
        <a id="players-link" href="#players">Oyuncular</a>
        <a href="https://itu-chess.onrender.com/#championship">Dönem sıralaması</a>
      </nav>
      <main>
        <div class="page-heading">
          <h1 id="title">Turnuvalar</h1>
          <p id="description">İTÜ Satranç Kulübü turnuva takvimi ve sonuçları.</p>
        </div>
        <div id="content" aria-busy="true">
          <p role="status">Turnuvalar yükleniyor…</p>
        </div>
        <p id="refresh-status" class="refresh-status" role="status"></p>
      </main>
    </div>
    <script type="module">
      const backend = 'https://prwyeokwsmxjryzdphho.supabase.co/functions/v1/itu-chess-public';
      const publishableKey = 'sb_publishable_haghW2955DQY0a7hLTa5mQ_TwUEhey-';
      const content = document.querySelector('#content');
      const title = document.querySelector('#title');
      const description = document.querySelector('#description');
      const refreshStatus = document.querySelector('#refresh-status');
      const statusLabels = { live: 'Devam ediyor', draft: 'Yaklaşan', finished: 'Tamamlandı' };
      const resultLabels = { '1/2': '½–½', '1-0': '1–0', '0-1': '0–1', '+-': '+–', '-+': '–+', '--': '––', bye: 'Bay', absent: 'Katılmadı' };
      const dateFormat = new Intl.DateTimeFormat('tr-TR', { dateStyle: 'long', timeZone: 'UTC' });
      let data;
      let loading = false;
      let loadFailed = false;
      let selectedRound;
      let refreshTimer;

      function node(tag, value = '', className = '') {
        const element = document.createElement(tag);
        element.textContent = value;
        element.className = className;
        return element;
      }

      function link(label, href, className) {
        const anchor = node('a', label, className);
        anchor.href = href;
        return anchor;
      }

      function route() {
        const [page, id] = location.hash.slice(1).split('/');
        if (page === 'players') return { page };
        if (page === 'tournament' && id) return { page, tournament: data?.tournaments.find(item => item.id === id) };
        return { page: 'tournaments' };
      }

      function search(label, callback) {
        const field = node('input', '', 'search');
        field.type = 'search';
        field.placeholder = label;
        field.setAttribute('aria-label', label);
        field.addEventListener('input', () => callback(field.value.trim().toLocaleLowerCase('tr')));
        return field;
      }

      function table(labels, bodyRows, label) {
        const wrapper = node('div', '', 'table-wrap');
        const grid = node('table');
        grid.setAttribute('aria-label', label);
        const header = grid.createTHead().insertRow();
        for (const name of labels) {
          const cell = node('th', name);
          cell.scope = 'col';
          header.append(cell);
        }
        const body = grid.createTBody();
        for (const values of bodyRows) {
          const row = body.insertRow();
          for (const value of values) row.append(node('td', value));
        }
        wrapper.append(grid);
        return wrapper;
      }

      function renderTournaments() {
        const list = node('ul', '', 'tournaments');
        const empty = node('p', 'Aramana uygun turnuva bulunamadı.', 'notice');
        const sorted = [...data.tournaments].sort((a, b) => b.date.localeCompare(a.date));
        function filter(query) {
          const results = sorted.filter(event => event.name.toLocaleLowerCase('tr').includes(query));
          list.replaceChildren(...results.map(event => {
            const item = node('li');
            const card = link('', '#tournament/' + encodeURIComponent(event.id), 'event');
            const summary = node('div');
            summary.append(node('h2', event.name), node('p',
              [dateFormat.format(new Date(event.date)), event.timeControl, event.roundsPlanned + ' tur'].filter(Boolean).join(' · ')));
            card.append(summary, node('span', statusLabels[event.status] ?? '', 'badge ' + event.status));
            item.append(card);
            return item;
          }));
          empty.hidden = results.length !== 0;
        }
        filter('');
        content.append(search('Turnuva ara', filter), list, empty);
      }

      function renderPlayers() {
        const results = node('div');
        const rating = player => player.itu ?? player.official ?? data.reference;
        const sorted = [...data.players].sort((a, b) => rating(b) - rating(a) || a.name.localeCompare(b.name, 'tr'));
        function filter(query) {
          const players = sorted.filter(player => player.name.toLocaleLowerCase('tr').includes(query));
          results.replaceChildren(players.length ? table(['Oyuncu', 'İTÜ Elo', 'Resmî rating', 'Maç'], players.map(player => [
            player.name, player.itu ?? '—', player.official == null ? '—' : player.official + ' ' + player.officialType, player.games ?? '—'
          ]), 'Kayıtlı oyuncular') : node('p', 'Aramana uygun oyuncu bulunamadı.', 'notice'));
        }
        filter('');
        content.append(search('Oyuncu adı ara', filter), results);
      }

      function renderEvent(event) {
        content.append(link('← Turnuvalara dön', '#tournaments', 'back'));
        if (!event) {
          content.append(node('p', 'Turnuva bulunamadı.', 'notice'));
          return;
        }
        if (event.status === 'live') {
          content.append(link('Canlı turnuva masası', 'https://itu-chess.onrender.com/#tournament/' + encodeURIComponent(event.id), 'back'));
        }
        if (!event.rounds?.length) {
          content.append(node('p', 'Bu turnuva için henüz tur sonucu yok.', 'notice'));
          return;
        }
        const rounds = event.rounds;
        const list = node('select');
        list.id = 'round';
        const label = node('label', 'Tur');
        label.htmlFor = list.id;
        const selector = node('div', '', 'round-select');
        const results = node('div');
        for (const round of rounds) {
          const option = node('option', round.number + '. tur');
          option.value = String(round.number);
          list.append(option);
        }
        list.value = rounds.some(round => String(round.number) === selectedRound) ? selectedRound : String(rounds.at(-1).number);
        function drawRound() {
          const round = rounds.find(item => String(item.number) === list.value);
          results.replaceChildren(table(['Masa', 'Beyaz', 'Siyah', 'Sonuç'], round.games.map(game => [
            game.board, game.white ?? '—', game.black ?? '—', resultLabels[game.result] ?? '—'
          ]), round.number + '. tur sonuçları'));
        }
        list.addEventListener('change', () => {
          selectedRound = list.value;
          drawRound();
        });
        selector.append(label, list);
        content.append(selector, results);
        drawRound();
      }

      function render() {
        const { page, tournament } = route();
        const players = page === 'players';
        const heading = players ? 'Oyuncular' : page === 'tournament' ? (tournament?.name ?? 'Turnuva') : 'Turnuvalar';
        document.title = heading + ' · İTÜ Satranç Kulübü';
        title.textContent = heading;
        description.textContent = players
          ? 'Kayıtlı oyuncular ve ratingleri.'
          : tournament ? [statusLabels[tournament.status], dateFormat.format(new Date(tournament.date)), tournament.timeControl].filter(Boolean).join(' · ')
            : 'İTÜ Satranç Kulübü turnuva takvimi ve sonuçları.';
        document.querySelector('#players-link').toggleAttribute('data-current', players);
        document.querySelector('#tournaments-link').toggleAttribute('data-current', !players);
        for (const anchor of document.querySelectorAll('.navigation a')) {
          if (anchor.hasAttribute('data-current')) anchor.setAttribute('aria-current', 'page');
          else anchor.removeAttribute('aria-current');
        }

        content.replaceChildren();
        content.setAttribute('aria-busy', String(!data && !loadFailed));
        if (!data && loadFailed) {
          const retry = node('button', 'Tekrar dene', 'button');
          retry.type = 'button';
          retry.addEventListener('click', load);
          content.append(node('p', 'Veriler yüklenemedi.', 'notice'), retry);
        } else if (!data) {
          const status = node('p', 'Veriler yükleniyor…', 'notice');
          status.setAttribute('role', 'status');
          content.append(status);
        } else if (players) {
          renderPlayers();
        } else if (page === 'tournament') {
          renderEvent(tournament);
        } else {
          renderTournaments();
        }
      }

      async function load() {
        if (loading) return;
        loading = true;
        if (loadFailed && !data) {
          loadFailed = false;
          render();
        }
        try {
          const response = await fetch(backend, {
            headers: { apikey: publishableKey },
            credentials: 'omit',
            signal: AbortSignal.timeout(8000)
          });
          if (!response.ok) throw new Error('Public data unavailable');
          data = await response.json();
          loadFailed = false;
          refreshStatus.textContent = '';
          render();
        } catch {
          loadFailed = true;
          if (data) refreshStatus.textContent = 'Bağlantı kesildi. Son görülen sonuçlar gösteriliyor.';
          else render();
        } finally {
          loading = false;
          scheduleRefresh();
        }
      }

      function scheduleRefresh() {
        clearTimeout(refreshTimer);
        const { tournament } = route();
        if (tournament?.status === 'live' && !document.hidden) {
          refreshTimer = setTimeout(load, loadFailed ? 40000 : 20000);
        }
      }

      window.addEventListener('hashchange', () => {
        selectedRound = undefined;
        render();
        scheduleRefresh();
        if (route().page === 'tournament' && data) void load();
      });
      document.addEventListener('visibilitychange', scheduleRefresh);
      render();
      void load();
    </script>
  </body>
</html>
